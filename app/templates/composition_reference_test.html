<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参考图生成参数 JSON 测试页</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f3f4f6;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.page{max-width:1500px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d9dee8;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(20,30,50,.05)}h1{margin:0 0 8px;font-size:24px}h2{font-size:17px;margin:0 0 12px}.muted{color:#64748b;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,button{width:100%;padding:10px;border-radius:7px;border:1px solid #cbd5e1}button{background:#2563eb;color:#fff;border:none;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.preview{width:100%;height:420px;object-fit:contain;background:#f8fafc;border:1px dashed #cbd5e1}svg.preview{display:block}pre{margin:0;min-height:180px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;font-size:12px}.status{padding:10px;border-radius:8px;background:#f8fafc;white-space:pre-wrap}.ok{color:#15803d}.error{color:#b91c1c}@media(max-width:900px){.form,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="page">
  <div class="card"><h1>参考图 → 点线面参数 JSON 草案测试页</h1><div class="muted">阶段 3A 独立原型：上传参考图，调用 Qwen，校验 CompositionParamDocument，并使用现有公共 SVG 图元渲染器预览。</div></div>
  <div class="card">
    <form id="generate-form" class="form">
      <div><label for="image">上传参考图（jpg/png/jpeg/webp）</label><input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required></div>
      <div><label for="user-hint">可选提示 user_hint</label><input id="user-hint" name="user_hint" placeholder="例如：尽量用少量大图元概括"></div>
      <div><button id="generate" type="submit">生成参数 JSON</button></div>
    </form>
  </div>
  <div class="grid">
    <div class="card"><h2>原图预览</h2><img id="source-preview" class="preview" alt="上传图片预览"></div>
    <div class="card"><h2>渲染预览</h2><svg id="render-preview" class="preview" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="card"><h2>模型原始文本输出 raw_text</h2><pre id="raw-text">尚未生成</pre></div>
    <div class="card"><h2>归一化后的 JSON normalized_payload</h2><pre id="normalized-json">尚未生成</pre></div>
    <div class="card"><h2>解析后的 JSON document</h2><pre id="parsed-json">尚未生成</pre></div>
    <div class="card"><h2>schema 校验结果 valid / errors / normalization_warnings</h2><div id="validation-result" class="status">尚未生成</div></div>
  </div>
</div>
<script src="/static/js/composition_param_renderer.js"></script>
<script>
const form=document.getElementById('generate-form'); const image=document.getElementById('image'); const button=document.getElementById('generate');
const raw=document.getElementById('raw-text'); const normalized=document.getElementById('normalized-json'); const parsed=document.getElementById('parsed-json'); const result=document.getElementById('validation-result'); const preview=document.getElementById('render-preview');
image.onchange=()=>{ const file=image.files[0]; if(file) document.getElementById('source-preview').src=URL.createObjectURL(file); };
function showResult(body){ raw.textContent=body.raw_text||''; normalized.textContent=body.normalized_payload?JSON.stringify(body.normalized_payload,null,2):'未生成 normalized_payload'; parsed.textContent=body.document?JSON.stringify(body.document,null,2):'未生成合法 document'; result.className='status '+(body.valid?'ok':'error'); result.textContent=`valid: ${Boolean(body.valid)}\nmessage: ${body.message||''}\nerrors: ${JSON.stringify(body.errors||[],null,2)}\nnormalization_warnings: ${JSON.stringify(body.normalization_warnings||[],null,2)}`; if(body.valid&&body.document){ window.CompositionParamRenderer.renderDocument(preview,body.document); } else { preview.innerHTML=''; } }
form.onsubmit=async(ev)=>{ ev.preventDefault(); if(!image.files[0]){ showResult({valid:false,message:'请先上传参考图',errors:[]}); return; } button.disabled=true; button.textContent='生成中...'; const data=new FormData(form); try{ const response=await fetch('/composition/generate-param-json',{method:'POST',body:data}); const body=await response.json(); showResult(body); }catch(err){ showResult({valid:false,message:`请求失败: ${err.message}`,errors:[]}); }finally{ button.disabled=false; button.textContent='生成参数 JSON'; } };
</script>
</body>
</html>
