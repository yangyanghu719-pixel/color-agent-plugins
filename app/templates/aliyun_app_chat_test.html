<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿里云 App JSON 输出</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-strong: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #dbe5f0;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --soft: #eff6ff;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(15px, 0.45vw + 13px, 17px);
      line-height: 1.55;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 32rem),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .page {
      width: min(1120px, calc(100% - clamp(28px, 5vw, 72px)));
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) 0;
    }

    header {
      margin-bottom: clamp(20px, 3vw, 32px);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3.2vw, 44px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 720px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 0.35vw + 13px, 16px);
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: clamp(16px, 2.5vw, 28px);
      align-items: stretch;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(219, 229, 240, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    form.card {
      padding: clamp(18px, 2.4vw, 26px);
      align-self: start;
    }

    .result.card {
      min-height: min(66vh, 760px);
      padding: clamp(18px, 2.4vw, 26px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: #334155;
      font-size: 0.9rem;
      font-weight: 750;
    }

    textarea,
    input[type="file"] {
      width: 100%;
      font: inherit;
    }

    textarea {
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    #prompt {
      min-height: 96px;
      margin-bottom: 18px;
    }

    input[type="file"] {
      margin: 0 0 20px;
      padding: 11px 12px;
      border: 1px dashed #b8c7dc;
      border-radius: 16px;
      background: #f8fafc;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.72; }

    #sendBtn {
      background: var(--primary);
      color: white;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
    }

    #sendBtn:hover:not(:disabled) { background: var(--primary-dark); }

    #clearBtn,
    #copyBtn {
      background: var(--soft);
      color: #1e3a8a;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .result-title {
      margin: 0;
      font-size: clamp(18px, 0.9vw + 15px, 24px);
      letter-spacing: -0.02em;
    }

    .status {
      min-height: 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #jsonOutput {
      flex: 1;
      min-height: clamp(360px, 58vh, 720px);
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(13px, 0.28vw + 12px, 15px);
      line-height: 1.62;
      white-space: pre;
    }

    @media (max-width: 820px) {
      .page { width: min(100% - 24px, 680px); padding: 24px 0; }
      main { grid-template-columns: 1fr; }
      .result.card { min-height: 0; }
      #jsonOutput { min-height: 52vh; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>JSON 输出</h1>
      <p class="subtitle">上传图片后，后台会自动完成完整处理流程；页面仅展示最终的 textarea_json。</p>
    </header>

    <main>
      <form class="card" id="chatForm">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" autocomplete="off">go</textarea>

        <label for="image">图片（png / jpg / jpeg / webp）</label>
        <input id="image" name="image" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" />

        <div class="actions">
          <button id="sendBtn" type="submit">生成 JSON</button>
          <button id="clearBtn" type="button">清空</button>
        </div>
      </form>

      <section class="card result" aria-labelledby="resultTitle">
        <div class="result-head">
          <h2 class="result-title" id="resultTitle">textarea_json</h2>
          <button id="copyBtn" type="button">复制</button>
        </div>
        <div class="status" id="status" aria-live="polite">等待上传图片。</div>
        <textarea id="jsonOutput" readonly placeholder="生成后的 textarea_json 会显示在这里"></textarea>
      </section>
    </main>
  </div>

  <script>
    const form = document.getElementById('chatForm');
    const promptInput = document.getElementById('prompt');
    const imageInput = document.getElementById('image');
    const clearBtn = document.getElementById('clearBtn');
    const sendBtn = document.getElementById('sendBtn');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');
    const jsonOutput = document.getElementById('jsonOutput');

    function setBusy(isBusy) {
      sendBtn.disabled = isBusy;
      sendBtn.textContent = isBusy ? '生成中…' : '生成 JSON';
    }

    function getErrorText(data, fallback) {
      return data?.message || data?.error || fallback || '生成失败，请稍后重试。';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim() || 'go';
      const file = imageInput.files[0];
      const formData = new FormData();
      formData.append('prompt', prompt);
      if (file) formData.append('image', file);

      setBusy(true);
      status.textContent = '后台处理中，请稍候…';
      jsonOutput.value = '';

      try {
        const response = await fetch('/aliyun-app-chat-test/send', { method: 'POST', body: formData });
        const data = await response.json();
        jsonOutput.value = data.textarea_json || (response.ok && data.ok ? '' : getErrorText(data));
        status.textContent = response.ok && data.ok ? '已生成。' : '生成失败。';
      } catch (error) {
        jsonOutput.value = String(error);
        status.textContent = '生成失败。';
      } finally {
        setBusy(false);
      }
    });

    clearBtn.addEventListener('click', () => {
      promptInput.value = 'go';
      imageInput.value = '';
      jsonOutput.value = '';
      status.textContent = '等待上传图片。';
      setBusy(false);
    });

    copyBtn.addEventListener('click', async () => {
      if (!jsonOutput.value) return;
      await navigator.clipboard.writeText(jsonOutput.value);
      status.textContent = '已复制到剪贴板。';
    });
  </script>
</body>
</html>
