<!doctype html>
<html><head><meta charset='utf-8'><title>色彩与形式构成实验台</title>
<script src='https://cdn.jsdelivr.net/npm/konva@9/konva.min.js'></script><script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script><script src='https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js'></script>
<style>
body{font-family:sans-serif;margin:16px}.hidden{display:none}.row{display:flex;gap:12px;align-items:flex-start}.card{border:1px solid #ddd;border-radius:8px;padding:10px}.primary{background:#1f6feb;color:#fff;border:none;padding:8px 12px;border-radius:6px}.secondary{background:#f5f5f5;border:1px solid #ddd;padding:8px 12px;border-radius:6px}button:disabled{opacity:.55;cursor:not-allowed}.notice{padding:8px;border-radius:6px;margin:8px 0}.warn{background:#fff4e5;color:#8a5200}.ok{background:#e8f7eb;color:#1f6b2a}.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.step{padding:6px 10px;border-radius:999px;background:#eee;color:#666}.step.active{background:#1f6feb;color:#fff}.step.done{background:#dff0ff;color:#0b4d92}.workspace{display:grid;grid-template-columns:320px 1fr 320px;gap:12px}.panel{border:1px solid #ddd;border-radius:8px;padding:10px;min-height:260px}#stage{background:#fafafa;min-height:520px}.obj-card{border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0;cursor:pointer}.obj-card.selected{border-color:#1f6feb;background:#eef5ff}.layer-item{border-bottom:1px solid #eee;padding:6px 0}#previewWrap{position:relative;display:inline-block}#preview{max-width:300px}#manualOverlay{position:absolute;left:0;top:0;pointer-events:none}
</style></head><body>
<h1>色彩与形式构成实验台</h1><input id='fileInput' type='file' class='hidden'><button id='uploadBtn' class='primary'>上传作品</button> <button id='reuploadBtn' class='secondary'>重新上传作品</button><div id='msg'></div>
<section id='choose' class='hidden'><h2>上传成功</h2><p>请选择本次实验方向</p><img id='preview' width='300'><div class='row'><div class='card'><h3>色彩实验</h3><button id='startColor' class='primary'>开始色彩实验</button></div><div class='card'><h3>构图实验</h3><button id='startComp' class='primary'>开始构图实验</button></div></div></section>
<section id='color' class='hidden'><h3>色彩实验</h3><div class='row'><div><p>原图 canvas</p><canvas id='origCanvas'></canvas></div><div><p>预览 canvas</p><canvas id='previewCanvas'></canvas></div></div><div id='swatches'></div><div>H:<input id='h' type='range' min='-180' max='180'> S:<input id='s' type='range' min='-100' max='100'> L:<input id='l' type='range' min='-100' max='100'></div><button id='saveSwatch'>保存该色块调整 /recolor</button><button id='analyzeColor'>生成色彩反馈 /analyze</button><ul id='history'></ul><div id='colorFeedback'></div></section>
<section id='compositionWorkspace' class='hidden'>
<div class='stepbar' id='compositionSteps'></div>
<div class='workspace'>
<div class='panel'>
<h3>原图与对象</h3><div class="hidden">物体级图层拆解模型未配置</div><h4>已识别到的画面对象</h4>
<div id='previewWrap'><img id='preview2' width='300'><canvas id='manualOverlay'></canvas></div>
<div id='emptyHint' class='notice warn hidden'>没有自动识别到可用对象，可以重新上传更清晰图片，或使用手动框选模式。</div>
<div id='objLoading'></div><div id='objSelectionCount'>已选择 0 个对象</div>
<div><button id='selectAllObj' class='secondary'>全选</button> <button id='clearAllObj' class='secondary'>取消全选</button></div>
<div id='objList'></div>
<button id='extractSelected' class='primary' disabled>提取所选对象为图层</button>
<button id='manualModeBtn' class='secondary'>手动框选模式</button>
<div id='manualControls' class='hidden'><div id='manualBoxInfo'>已选择区域：-</div><button id='manualConfirm' class='primary'>确认提取该区域</button><button id='manualReset' class='secondary'>重新框选</button><button id='manualCancel' class='secondary'>取消框选</button></div>
</div>
<div class='panel'><h3>构图编辑画布</h3><div id='compStatus' class='notice warn'>请先识别并提取图层。</div><div id='stage'></div><ul id='ops'></ul></div>
<div class='panel'><h3>图层面板</h3><div id='layerPanel'></div><h4>当前图层操作</h4>
<div><button id='actFront'>置于顶层</button><button id='actBack'>置于底层</button><button id='actUp'>上移一层</button><button id='actDown'>下移一层</button><button id='actFlipX'>水平镜像</button><button id='actFlipY'>垂直镜像</button><button id='actHide'>隐藏图层</button><button id='actDelete'>删除图层</button><button id='actReset'>重置该元素</button></div>
</div></div>
<div class='panel'><h3>保存与反馈</h3><button id='saveComp' class='primary'>保存当前构图</button><button id='analyzeComp' class='primary' disabled>生成构图反馈</button><div id='saveHint' class='notice warn'>请先保存当前构图，再生成反馈。</div><img id='savedPreview' class='hidden' width='240'><div id='compFeedback'></div></div>
<details id='devDebug'><summary>开发者调试信息</summary><pre id='extractDebug'></pre><div id='layerDebug'></div></details>
</section><div id='menu'></div>
<script>
const API=location.origin,S={uploaded:{},colorExperiment:{history:[]},compositionExperiment:{operations:[],layers:[]},isSaved:false,currentStep:0}; const $=x=>document.getElementById(x); const msg=t=>$('msg').textContent=t||'';
const steps=['上传作品','识别对象','选择对象','提取图层','构图编辑','生成反馈'];
function renderSteps(){ $('compositionSteps').innerHTML=steps.map((t,i)=>`<span class="step ${i<S.currentStep?'done':''} ${i===S.currentStep?'active':''}">${t}</span>`).join(''); }
function setStep(i){S.currentStep=i;renderSteps();}
function setSavedState(saved,text){S.isSaved=saved;$('analyzeComp').disabled=!saved;$('saveHint').textContent=text;$('saveHint').className='notice '+(saved?'ok':'warn');}
async function apiFetch(url,opt,err){try{return await (await fetch(url,opt)).json();}catch(e){throw new Error(err)}}
$('uploadBtn').onclick=$('reuploadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async()=>{const f=$('fileInput').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);$('uploadBtn').disabled=true;try{const b=await apiFetch(API+'/upload-image',{method:'POST',body:fd},'上传失败，请检查网络后重试。');if(b.status!=='success')throw new Error(b.message||'上传失败');S.uploaded={originalImageUrl:b.original_image_url,displayUrl:b.display_url};$('preview').src=b.display_url;$('preview2').src=b.display_url;$('choose').classList.remove('hidden');$('compositionWorkspace').classList.remove('hidden');setStep(0);}catch(e){msg(e.message)}finally{$('uploadBtn').disabled=false;}};
let regions=[],active;
$('startColor').onclick=async()=>{try{const b=await apiFetch(API+'/segment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.originalImageUrl,color_count:5})},'色彩识别失败，请稍后重试。');S.colorExperiment=b;regions=b.color_regions;$('color').classList.remove('hidden');$('swatches').innerHTML=regions.map(r=>`<button data-id="${r.id}" style="background:${r.hex}">${r.name}</button>`).join('');document.querySelectorAll('#swatches button').forEach(btn=>btn.onclick=()=>active=regions.find(r=>r.id===btn.dataset.id));}catch(e){msg(e.message)}};
async function doPreview(){if(!active)return;try{const p={image_id:S.colorExperiment.image_id,original_image_url:S.uploaded.originalImageUrl,target_region_id:active.id,original_hsl:active.hsl,new_hsl:{h:(active.hsl.h+Number($('h').value)+360)%360,s:Math.max(0,Math.min(100,active.hsl.s+Number($('s').value))),l:Math.max(0,Math.min(100,active.hsl.l+Number($('l').value)))}};const b=await apiFetch(API+'/recolor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)},'预览失败');const im=new Image();im.src=b.preview_image_url;im.onload=()=>{$('previewCanvas').getContext('2d').drawImage(im,0,0)};S.colorExperiment.last=b;}catch(e){msg(e.message)}}
['h','s','l'].forEach(id=>$(id).oninput=doPreview);
$('analyzeColor').onclick=async()=>{try{const p={original_color_regions:regions,adjusted_color_regions:regions,before_image_url:S.uploaded.originalImageUrl,after_image_url:(S.colorExperiment.last&&S.colorExperiment.last.preview_image_url)||S.uploaded.displayUrl};const b=await apiFetch(API+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)},'色彩分析失败');$('colorFeedback').innerHTML=DOMPurify.sanitize(marked.parse(b.learning_explanation||b.summary||''));}catch(e){msg(e.message)}};
let stage,bgLayer,objLayer,tr,selectedNode,layerNodes=[];
function op(type,id,d){S.compositionExperiment.operations.push({type,layer_id:id,description:d});$('ops').innerHTML=S.compositionExperiment.operations.map(x=>`<li>${x.description}</li>`).join('');if(type){setSavedState(false,'当前画布有新改动，请重新保存后再生成反馈。');}}
function updateObjectSelectionUI(){const c=(S.detectedObjects||[]).filter(o=>o.selected).length;$('objSelectionCount').textContent=`已选择 ${c} 个对象`;$('extractSelected').disabled=!c;setStep(c?2:1);renderObjects();}
function renderObjects(){const objs=S.detectedObjects||[];$('objList').innerHTML=objs.map(o=>`<div class="obj-card ${o.selected?'selected':''}" data-id="${o.id}"><b>${o.name||'未命名对象'}</b><div>${o.label_en||''}</div><div>${o.description||''}</div><div>${o.confidence!=null?('置信度: '+o.confidence):''}</div><div>${o.selected?'已选择':'未选择'}</div></div>`).join('');document.querySelectorAll('.obj-card').forEach(el=>el.onclick=()=>{const obj=objs.find(o=>o.id===el.dataset.id);obj.selected=!obj.selected;updateObjectSelectionUI();});}
$('startComp').onclick=async()=>{$('objLoading').textContent='正在识别画面对象……';setStep(1);try{const b=await apiFetch(API+'/composition/objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl})},'识别失败，请稍后重试，或使用手动框选模式。');S.detectedObjects=(b.objects||[]).map(o=>({...o,selected:true}));$('emptyHint').classList.toggle('hidden',S.detectedObjects.length>0);renderObjects();updateObjectSelectionUI();}catch(e){$('emptyHint').classList.remove('hidden');msg(e.message)}finally{$('objLoading').textContent='';}};
$('selectAllObj').onclick=()=>{(S.detectedObjects||[]).forEach(o=>o.selected=true);updateObjectSelectionUI();};$('clearAllObj').onclick=()=>{(S.detectedObjects||[]).forEach(o=>o.selected=false);updateObjectSelectionUI();};
function showExtractDebug(b){$('extractDebug').textContent=JSON.stringify({status:b.status,message:b.message,fallback_used:b.fallback_used,segmentation_method:b.segmentation_method,inpainting_used:b.inpainting_used,warning:b.warning,segmentation_debug:b.segmentation_debug,raw_output_preview:b.raw_output_preview},null,2);$('layerDebug').innerHTML=(b.layers||[]).map(l=>`<div>bbox:${JSON.stringify(l.bbox)} coverage:${l.coverage} mask_url:${l.mask_url} layer_url:${l.layer_url}</div>`).join('');}
async function loadCompCanvas(b){S.compositionExperiment={...b,operations:[]};S.isSaved=false;setStep(4);setSavedState(false,'请先保存当前构图，再生成反馈。');$('compStatus').textContent='你可以拖拽、缩放、旋转并调整层级。';stage=new Konva.Stage({container:'stage',width:b.canvas.width,height:b.canvas.height});bgLayer=new Konva.Layer();objLayer=new Konva.Layer();stage.add(bgLayer);stage.add(objLayer);const bgUrl=b.clean_background_url||b.processed_original_url||b.background_url;if(bgUrl){const bi=new Image();bi.src=bgUrl;await new Promise(r=>bi.onload=r);bgLayer.add(new Konva.Image({image:bi,x:0,y:0,listening:false,name:'background'}));}
layerNodes=[];for(const l of b.layers){const im=new Image();im.src=l.layer_url;await new Promise(r=>im.onload=r);const n=new Konva.Image({image:im,x:l.transform.x,y:l.transform.y,draggable:true,name:l.id,visible:l.visible});n.on('dragend',()=>op('move',l.id,`你移动了元素 ${l.id}`));n.on('transformend',()=>{op('scale',l.id,`你缩放了元素 ${l.id}`);op('rotate',l.id,`你旋转了元素 ${l.id}`)});n.on('click',()=>{selectedNode=n;tr.nodes([n]);renderLayerPanel()});objLayer.add(n);layerNodes.push({def:l,node:n});}
tr=new Konva.Transformer();objLayer.add(tr);renderLayerPanel();stage.draw();}
function selectedMeta(){return layerNodes.find(v=>v.node===selectedNode)}
function constrainObjectBottom(node){if(!node)return;node.zIndex(Math.max(0,node.zIndex()));}
function applyAction(action){const m=selectedMeta();if(!m)return;const n=m.node,d=m.def;action(n,d);constrainObjectBottom(n);objLayer.draw();renderLayerPanel();}
function renderLayerPanel(){ $('layerPanel').innerHTML=layerNodes.map(({def,node})=>`<div class='layer-item'><b>${def.name}</b> ${def.label_en||''} | ${node.visible()?'可见':'隐藏'} <button data-a='toggle' data-id='${def.id}'>可见/隐藏</button><button data-a='del' data-id='${def.id}'>删除</button><button data-a='reset' data-id='${def.id}'>重置</button> ${selectedNode===node?'[当前选中]':''}</div>`).join('');document.querySelectorAll('#layerPanel button').forEach(b=>b.onclick=()=>{const item=layerNodes.find(x=>x.def.id===b.dataset.id);if(!item)return;selectedNode=item.node;if(b.dataset.a==='toggle')applyAction((n,d)=>{n.visible(!n.visible());op('hide',d.id,`你隐藏了元素 ${d.id}`)});if(b.dataset.a==='del')applyAction((n,d)=>{n.destroy();layerNodes=layerNodes.filter(v=>v!==item);op('delete',d.id,`你删除了元素 ${d.id}`)});if(b.dataset.a==='reset')applyAction((n,d)=>{n.position({x:d.transform.x,y:d.transform.y});n.scale({x:1,y:1});n.rotation(0);n.visible(true);n.setAttr('flip_x',false);n.setAttr('flip_y',false);op('reset',d.id,`你重置了元素 ${d.id}`)});});}
$('actFront').onclick=()=>applyAction((n,d)=>{n.moveToTop();tr.moveToTop();op('bring_to_front',d.id,`你将元素 ${d.id} 置于顶层`)});
$('actBack').onclick=()=>applyAction((n,d)=>{n.moveToBottom();op('send_to_back',d.id,`你将元素 ${d.id} 置于底层`)});
$('actUp').onclick=()=>applyAction((n,d)=>{n.moveUp();tr.moveToTop();op('z_order_up',d.id,`你上移了一层 ${d.id}`)});
$('actDown').onclick=()=>applyAction((n,d)=>{n.moveDown();op('z_order_down',d.id,`你下移了一层 ${d.id}`)});
$('actFlipX').onclick=()=>applyAction((n,d)=>{n.scaleX(-n.scaleX()||-1);n.setAttr('flip_x',!n.getAttr('flip_x'));op('flip_x',d.id,`你水平镜像了元素 ${d.id}`)});
$('actFlipY').onclick=()=>applyAction((n,d)=>{n.scaleY(-n.scaleY()||-1);n.setAttr('flip_y',!n.getAttr('flip_y'));op('flip_y',d.id,`你垂直镜像了元素 ${d.id}`)});
$('actHide').onclick=()=>applyAction((n,d)=>{n.visible(false);op('hide',d.id,`你隐藏了元素 ${d.id}`)});
$('actDelete').onclick=()=>applyAction((n,d)=>{n.destroy();layerNodes=layerNodes.filter(v=>v.def.id!==d.id);op('delete',d.id,`你删除了元素 ${d.id}`)});
$('actReset').onclick=()=>applyAction((n,d)=>{n.position({x:d.transform.x,y:d.transform.y});n.scale({x:1,y:1});n.rotation(0);n.visible(true);n.setAttr('flip_x',false);n.setAttr('flip_y',false);op('reset',d.id,`你重置了元素 ${d.id}`)});
$('extractSelected').onclick=async()=>{$('extractSelected').disabled=true;$('objLoading').textContent='正在提取图层，可能需要 20–60 秒……';setStep(3);try{const objs=(S.detectedObjects||[]).filter(o=>o.selected).map(o=>({id:o.id,name:o.name,label_en:o.label_en}));const b=await apiFetch(API+'/layers/extract-by-objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl,objects:objs,need_inpainting:true})},'图层提取失败，请查看开发者调试信息或使用手动框选。');showExtractDebug(b);if(b.status!=='success'||!b.layers||b.layers.length===0){$('compStatus').textContent='没有提取到有效图层。可能是图像对象边界不清晰，你可以改用手动框选。';return;}await loadCompCanvas(b);}catch(e){msg(e.message)}finally{$('extractSelected').disabled=false;$('objLoading').textContent='';}};
let drawing=false,start=null,rect=null;
function setupOverlay(){const img=$('preview2'),cv=$('manualOverlay');cv.width=img.clientWidth;cv.height=img.clientHeight;cv.style.width=img.clientWidth+'px';cv.style.height=img.clientHeight+'px';}
function drawRect(){const c=$('manualOverlay').getContext('2d');c.clearRect(0,0,$('manualOverlay').width,$('manualOverlay').height);if(!rect)return;c.fillStyle='rgba(31,111,235,0.25)';c.strokeStyle='#1f6feb';c.lineWidth=2;c.fillRect(rect.x,rect.y,rect.width,rect.height);c.strokeRect(rect.x,rect.y,rect.width,rect.height);$('manualBoxInfo').textContent=`已选择区域：${Math.round(rect.x)}, ${Math.round(rect.y)}, ${Math.round(rect.width)}, ${Math.round(rect.height)}`;}
$('manualModeBtn').onclick=()=>{$('manualControls').classList.remove('hidden');setupOverlay();$('manualOverlay').style.pointerEvents='auto';};
$('manualOverlay').onmousedown=(e)=>{drawing=true;const r=e.target.getBoundingClientRect();start={x:e.clientX-r.left,y:e.clientY-r.top};rect={x:start.x,y:start.y,width:0,height:0};drawRect();};$('manualOverlay').onmousemove=(e)=>{if(!drawing)return;const r=e.target.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;rect={x:Math.min(start.x,x),y:Math.min(start.y,y),width:Math.abs(x-start.x),height:Math.abs(y-start.y)};drawRect();};$('manualOverlay').onmouseup=()=>drawing=false;
$('manualReset').onclick=()=>{rect=null;drawRect();};$('manualCancel').onclick=()=>{$('manualControls').classList.add('hidden');$('manualOverlay').getContext('2d').clearRect(0,0,$('manualOverlay').width,$('manualOverlay').height);};
$('manualConfirm').onclick=async()=>{if(!rect||rect.width<6||rect.height<6){msg('框选区域太小，请重新选择。');return;}const img=$('preview2');const sx=img.naturalWidth/img.clientWidth,sy=img.naturalHeight/img.clientHeight;const bbox={x:rect.x*sx,y:rect.y*sy,width:rect.width*sx,height:rect.height*sy};try{const b=await apiFetch(API+'/layers/manual-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl,bbox})},'图层提取失败，请查看开发者调试信息或使用手动框选。');showExtractDebug(b);if(b.status!=='success'||!b.layers||!b.layers.length){$('compStatus').textContent='没有提取到有效图层。可能是图像对象边界不清晰，你可以改用手动框选。';return;}await loadCompCanvas(b);}catch(e){msg(e.message)}};
$('saveComp').onclick=async()=>{if(!objLayer)return;$('saveComp').disabled=true;try{const layers=objLayer.getChildren(n=>n.className==='Image').map((n,i)=>{const m=layerNodes.find(v=>v.node===n);if(!m||!n.visible())return null;return{id:m.def.id,layer_url:m.def.layer_url,x:n.x(),y:n.y(),scale_x:Math.abs(n.scaleX()),scale_y:Math.abs(n.scaleY()),rotation:n.rotation(),flip_x:!!n.getAttr('flip_x'),flip_y:!!n.getAttr('flip_y'),visible:n.visible(),opacity:n.opacity(),z_index:i+1}}).filter(Boolean);const bg=S.compositionExperiment.clean_background_url||S.compositionExperiment.processed_original_url||S.compositionExperiment.background_url;const b=await apiFetch(API+'/layers/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_id:S.compositionExperiment.image_id,background_url:bg,layers,operations:S.compositionExperiment.operations,inpainting_used:S.compositionExperiment.inpainting_used})},'保存失败，请检查网络后重试。');S.compositionExperiment.workingImageUrl=b.after_image_url;$('savedPreview').src=b.after_image_url;$('savedPreview').classList.remove('hidden');setSavedState(true,'已保存当前构图');setStep(5);}catch(e){msg(e.message)}finally{$('saveComp').disabled=false;}};
$('analyzeComp').onclick=async()=>{if(!S.isSaved)return;try{const p={before_image_url:S.uploaded.displayUrl,after_image_url:S.compositionExperiment.workingImageUrl,layers_before:S.compositionExperiment.layers,layers_after:[],operations:S.compositionExperiment.operations,user_goal:'用于形式构成课程实验'};const b=await apiFetch(API+'/composition/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)},'构图反馈生成失败，请稍后重试。');$('compFeedback').innerHTML=DOMPurify.sanitize(marked.parse(b.learning_explanation||b.summary||''));}catch(e){msg(e.message)}};
renderSteps();
</script></body></html>
