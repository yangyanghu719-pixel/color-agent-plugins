<!doctype html><html><head><meta charset='utf-8'><title>色彩与形式构成实验台</title>
<script src='https://cdn.jsdelivr.net/npm/konva@9/konva.min.js'></script><script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script><script src='https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js'></script>
<style>body{font-family:sans-serif}.hidden{display:none}#menu{position:absolute;background:#fff;border:1px solid #ddd;display:none;z-index:99}#menu button{display:block;width:180px}.cards{display:flex;gap:10px}.row{display:flex;gap:8px}canvas{border:1px solid #ddd}.stepbar{display:flex;gap:8px;margin:8px 0;padding:0;list-style:none}.stepbar li{padding:6px 10px;border:1px solid #ccc;border-radius:8px;color:#666}.stepbar li.active{background:#e8f3ff;border-color:#4a90e2;color:#114}.stepbar li.disabled{opacity:.45}.panel{border:1px solid #ddd;padding:8px;margin:8px 0}.layout{display:flex;gap:12px}.stageWrap{position:relative}.layer-panel{min-width:280px;max-width:360px;border:1px solid #ddd;padding:8px}#manualOverlay{position:absolute;inset:0;cursor:crosshair}.notice{background:#fffbe8;border:1px solid #f0dc9b;padding:8px;margin:8px 0}</style></head><body>
<h1>色彩与形式构成实验台</h1><input id='fileInput' type='file' class='hidden'><button id='uploadBtn'>上传作品</button><button id='reuploadBtn'>重新上传作品</button><div id='msg'></div>
<section id='choose' class='hidden'><h2>上传成功</h2><p>请选择本次实验方向</p><img id='preview' width='300'><div class='cards'><div><h3>色彩实验</h3><button id='startColor'>开始色彩实验</button></div><div><h3>构图实验</h3><button id='startComp'>开始构图实验</button><div id="objPanel" class="hidden"><ul id='compSteps' class='stepbar'></ul><h4>已识别到的画面对象</h4><div id='objHint' class='notice hidden'></div><div id="objList"></div><button id="extractSelected" disabled>提取所选对象为图层</button><button id="manualModeFromObjectPanel">手动框选模式</button></div></div></div></section>
<section id='color' class='hidden'><h3>色彩实验</h3><div class='row'><div><p>原图 canvas</p><canvas id='origCanvas'></canvas></div><div><p>预览 canvas</p><canvas id='previewCanvas'></canvas></div></div><div id='swatches'></div><div>H:<input id='h' type='range' min='-180' max='180'> S:<input id='s' type='range' min='-100' max='100'> L:<input id='l' type='range' min='-100' max='100'></div><button id='saveSwatch'>保存该色块调整 /recolor</button><button id='analyzeColor'>生成色彩反馈 /analyze</button><ul id='history'></ul><div id='colorFeedback'></div></section>
<section id='compNotice' class='hidden'><div id='compNoticeText'>物体级图层拆解模型未配置</div><button id='backChoose'>返回实验选择</button><button id='manualModeFromNotice'>使用手动框选模式</button></section><section id='comp' class='hidden'><button id='saveComp'>保存新图</button><button id='analyzeComp' disabled>生成构图反馈</button><div id='saveNotice'></div><div class='layout'><div class='stageWrap'><div id='stage'></div><canvas id='manualOverlay' class='hidden'></canvas></div><aside class='layer-panel'><h4>图层面板</h4><div id='selectedLayerOps'>请选择图层</div><div id='layerList'></div></aside></div><ul id='ops'></ul><div id='compFeedback'></div></section>
<details id='devDebug'><summary>开发者调试信息</summary><pre id='extractDebug'></pre><div id='layerDebug'></div></details>
<div id='menu'></div>
<script>
const API=location.origin,S={uploaded:{},colorExperiment:{history:[]},compositionExperiment:{operations:[]},compStep:0,isSaved:false}; const $=x=>document.getElementById(x); const msg=t=>$('msg').textContent=t||'';
const STEPS=['上传作品','识别对象','选择对象','提取图层','构图编辑','生成反馈'];
function renderSteps(i){$('compSteps').innerHTML=STEPS.map((s,idx)=>`<li class="${idx===i?'active':''} ${idx>i?'disabled':''}">${idx+1}. ${s}</li>`).join('');S.compStep=i}
function setBusy(btnId,txt,busy){if(btnId){$(btnId).disabled=busy}msg(busy?txt:'')}
$('uploadBtn').onclick=$('reuploadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async()=>{const f=$('fileInput').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const b=await (await fetch(API+'/upload-image',{method:'POST',body:fd})).json();S.uploaded={originalImageUrl:b.original_image_url,displayUrl:b.display_url};$('preview').src=b.display_url;$('choose').classList.remove('hidden');renderSteps(0)};
let regions=[],active;
$('startColor').onclick=async()=>{const b=await (await fetch(API+'/segment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.originalImageUrl,color_count:5})})).json();S.colorExperiment=b;regions=b.color_regions;$('color').classList.remove('hidden');$('swatches').innerHTML=regions.map(r=>`<button data-id="${r.id}" style="background:${r.hex}">${r.name}</button>`).join('');document.querySelectorAll('#swatches button').forEach(btn=>btn.onclick=()=>active=regions.find(r=>r.id===btn.dataset.id));const img=new Image();img.src=S.uploaded.displayUrl;img.onload=()=>{for(const id of ['origCanvas','previewCanvas']){$(id).width=img.width;$(id).height=img.height;$(id).getContext('2d').drawImage(img,0,0)}}};
async function doPreview(){if(!active)return;const p={image_id:S.colorExperiment.image_id,original_image_url:S.uploaded.originalImageUrl,target_region_id:active.id,original_hsl:active.hsl,new_hsl:{h:(active.hsl.h+Number($('h').value)+360)%360,s:Math.max(0,Math.min(100,active.hsl.s+Number($('s').value))),l:Math.max(0,Math.min(100,active.hsl.l+Number($('l').value)))}};const b=await (await fetch(API+'/recolor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json();const im=new Image();im.src=b.preview_image_url;im.onload=()=>{$('previewCanvas').getContext('2d').drawImage(im,0,0)};S.colorExperiment.last=b;}
['h','s','l'].forEach(id=>$(id).oninput=doPreview);
$('saveSwatch').onclick=()=>{S.colorExperiment.history.push({region:active&&active.name,h:$('h').value,s:$('s').value,l:$('l').value});$('history').innerHTML=S.colorExperiment.history.map(x=>`<li>${x.region}: H${x.h}/S${x.s}/L${x.l}</li>`).join('')};
$('analyzeColor').onclick=async()=>{const p={original_color_regions:regions,adjusted_color_regions:regions,before_image_url:S.uploaded.originalImageUrl,after_image_url:(S.colorExperiment.last&&S.colorExperiment.last.preview_image_url)||S.uploaded.displayUrl};const b=await (await fetch(API+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json();$('colorFeedback').innerHTML=DOMPurify.sanitize(marked.parse(b.learning_explanation||b.summary||''));};
let stage,backgroundLayer,objectLayer,selected,layerNodes=[];
function op(type,id,d){S.compositionExperiment.operations.push({type,layer_id:id,description:d});$('ops').innerHTML=S.compositionExperiment.operations.map(x=>`<li>${x.description}</li>`).join('')}
$('backChoose').onclick=()=>$('choose').classList.remove('hidden');
function showExtractDebug(b){const payload={status:b.status,message:b.message,fallback_used:b.fallback_used,segmentation_method:b.segmentation_method,inpainting_used:b.inpainting_used,inpainting_fallback_used:b.inpainting_fallback_used,layers_length:(b.layers||[]).length,warning:b.warning,segmentation_debug:b.segmentation_debug};$('extractDebug').textContent=JSON.stringify(payload,null,2)}
function renderLayerDebug(layers){$('layerDebug').innerHTML=(layers||[]).map(l=>`<div style="border:1px solid #ddd;padding:6px;margin:6px 0"><div><b>${l.name||''}</b> / ${l.label_en||''}</div><div>bbox: ${JSON.stringify(l.bbox||{})}</div><div>coverage: ${l.coverage}</div><div>mask_url: <a href="${l.mask_url}" target="_blank">${l.mask_url}</a></div></div>`).join('')}
function resetLayer(n,def){n.position({x:def.transform.x,y:def.transform.y});n.scale({x:1,y:1});n.rotation(0);n.setAttr('flip_x',false);n.setAttr('flip_y',false);n.visible(true);n.opacity(1)}
function renderLayerPanel(){const list=layerNodes.map(({def,node})=>`<div class='panel'><div><b>${def.name||def.id}</b> / ${def.label_en||''}</div><div><button data-act='toggle' data-id='${def.id}'>${node.visible()?'隐藏':'显示'}</button><button data-act='delete' data-id='${def.id}'>删除</button><button data-act='reset' data-id='${def.id}'>重置</button></div></div>`).join('');$('layerList').innerHTML=list;document.querySelectorAll('#layerList button').forEach(btn=>btn.onclick=()=>{const t=layerNodes.find(x=>x.def.id===btn.dataset.id);if(!t)return;const n=t.node;if(btn.dataset.act==='toggle'){n.visible(!n.visible());op('hide',t.def.id,`你${n.visible()?'显示':'隐藏'}了元素 ${t.def.id}`)}if(btn.dataset.act==='delete'){n.destroy();layerNodes=layerNodes.filter(x=>x!==t);op('delete',t.def.id,`你删除了元素 ${t.def.id}`)}if(btn.dataset.act==='reset'){resetLayer(n,t.def);op('reset',t.def.id,`你重置了元素 ${t.def.id}`)}objectLayer.draw();renderLayerPanel();renderSelectedOps()})}
function renderSelectedOps(){if(!selected){$('selectedLayerOps').textContent='请选择图层';return}const m=layerNodes.find(v=>v.node===selected);if(!m){$('selectedLayerOps').textContent='请选择图层';return}$('selectedLayerOps').innerHTML=`<div><b>当前图层:</b> ${m.def.name||m.def.id}</div><button id='upBtn'>上移一层</button><button id='downBtn'>下移一层</button><button id='fxBtn'>水平镜像</button><button id='fyBtn'>垂直镜像</button><button id='hideBtn'>隐藏</button><button id='delBtn'>删除</button><button id='resetBtn'>重置</button>`;$('upBtn').onclick=()=>{selected.moveUp();op('z_order_up',m.def.id,'上移一层');objectLayer.draw()};$('downBtn').onclick=()=>{selected.moveDown();op('z_order_down',m.def.id,'下移一层');objectLayer.draw()};$('fxBtn').onclick=()=>{selected.scaleX(-selected.scaleX());selected.setAttr('flip_x',!selected.getAttr('flip_x'));op('flip_x',m.def.id,'水平镜像');objectLayer.draw()};$('fyBtn').onclick=()=>{selected.scaleY(-selected.scaleY());selected.setAttr('flip_y',!selected.getAttr('flip_y'));op('flip_y',m.def.id,'垂直镜像');objectLayer.draw()};$('hideBtn').onclick=()=>{selected.visible(false);op('hide',m.def.id,'隐藏图层');objectLayer.draw();renderLayerPanel()};$('delBtn').onclick=()=>{selected.destroy();layerNodes=layerNodes.filter(x=>x!==m);selected=null;op('delete',m.def.id,'删除图层');objectLayer.draw();renderLayerPanel();renderSelectedOps()};$('resetBtn').onclick=()=>{resetLayer(selected,m.def);op('reset',m.def.id,'重置图层');objectLayer.draw()}}
async function loadCompCanvas(b){S.compositionExperiment={...b,operations:[]};S.isSaved=false;$('analyzeComp').disabled=true;$('saveNotice').innerHTML='';const bgUrl=b.clean_background_url||b.processed_original_url;stage=new Konva.Stage({container:'stage',width:b.canvas.width,height:b.canvas.height});backgroundLayer=new Konva.Layer();objectLayer=new Konva.Layer();stage.add(backgroundLayer);stage.add(objectLayer);if(bgUrl){const bim=new Image();bim.src=bgUrl;await new Promise(r=>bim.onload=r);backgroundLayer.add(new Konva.Image({image:bim,x:0,y:0,listening:false,name:'background'}));}layerNodes=[];for(const l of b.layers){const im=new Image();im.src=l.layer_url;await new Promise(r=>im.onload=r);const n=new Konva.Image({image:im,x:l.transform.x,y:l.transform.y,draggable:true,name:l.id});n.on('dragend',()=>op('move',l.id,`你移动了元素 ${l.id}`));n.on('transformend',()=>{op('scale',l.id,`你缩放了元素 ${l.id}`);op('rotate',l.id,`你旋转了元素 ${l.id}`)});n.on('contextmenu',e=>showMenu(e.evt.clientX,e.evt.clientY,n,l));objectLayer.add(n);layerNodes.push({def:l,node:n})}const tr=new Konva.Transformer();objectLayer.add(tr);stage.on('click',e=>{selected=e.target===stage?null:e.target;tr.nodes(selected?[selected]:[]);$('menu').style.display='none';renderSelectedOps()});backgroundLayer.draw();objectLayer.draw();renderLayerDebug(b.layers);renderLayerPanel();$('comp').classList.remove('hidden');renderSteps(4)}
$('startComp').onclick=async()=>{renderSteps(1);setBusy('startComp','正在识别画面对象……',true);const b=await (await fetch(API+'/composition/objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl})})).json();setBusy('startComp','',false);$('objPanel').classList.remove('hidden');const objs=b.objects||[];const fallback=b.fallback_used===true;$('objHint').classList.add('hidden');if(!objs.length||fallback){$('objHint').classList.remove('hidden');$('objHint').textContent='没有自动识别到可用对象，可以重新上传更清晰图片，或使用手动框选模式。';$('objList').innerHTML='';$('extractSelected').disabled=true;renderSteps(2);return;}$('objList').innerHTML=objs.map(o=>`<label><input type="checkbox" data-id="${o.id}" checked>${o.name}</label>`).join('');$('extractSelected').disabled=false;S.detectedObjects=objs;renderSteps(2)};
$('extractSelected').onclick=async()=>{setBusy('extractSelected','正在提取图层，可能需要 20–60 秒……',true);renderSteps(3);const ids=[...document.querySelectorAll('#objList input:checked')].map(i=>i.getAttribute('data-id'));const objs=(S.detectedObjects||[]).filter(o=>ids.includes(o.id)).map(o=>({id:o.id,name:o.name,label_en:o.label_en}));const b=await (await fetch(API+'/layers/extract-by-objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl,objects:objs,need_inpainting:true})})).json();setBusy('extractSelected','',false);showExtractDebug(b);if(b.status!=='success'||!b.layers||b.layers.length===0){$('compNoticeText').textContent=`提取失败: ${b.status} / ${b.message}`;$('compNotice').classList.remove('hidden');return;}await loadCompCanvas(b)};
async function enterManualMode(){const c=$('manualOverlay'),img=$('preview');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;c.style.width=img.width+'px';c.style.height=(img.height||img.width*0.75)+'px';c.classList.remove('hidden');const ctx=c.getContext('2d');let start=null,end=null;function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(0,0,c.width,c.height);if(!start||!end)return;const x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),w=Math.abs(start.x-end.x),h=Math.abs(start.y-end.y);ctx.clearRect(x,y,w,h);ctx.strokeStyle='#35f';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}
c.onmousedown=e=>{start={x:e.offsetX*(c.width/c.clientWidth),y:e.offsetY*(c.height/c.clientHeight)};end=start;draw()};c.onmousemove=e=>{if(!start)return;end={x:e.offsetX*(c.width/c.clientWidth),y:e.offsetY*(c.height/c.clientHeight)};draw()};c.onmouseup=async()=>{if(!start||!end)return;const bbox={x:Math.round(Math.min(start.x,end.x)),y:Math.round(Math.min(start.y,end.y)),width:Math.round(Math.abs(start.x-end.x)),height:Math.round(Math.abs(start.y-end.y))};if(!confirm(`确认提取该区域？${JSON.stringify(bbox)}`))return;c.classList.add('hidden');const b=await (await fetch(API+'/layers/manual-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_url:S.uploaded.displayUrl,bbox})})).json();await loadCompCanvas(b)};}
$('manualModeFromObjectPanel').onclick=enterManualMode;$('manualModeFromNotice').onclick=enterManualMode;
function showMenu(x,y,node,def){const m=$('menu');m.style.left=x+'px';m.style.top=y+'px';m.style.display='block';const items=[['上移一层',()=>{node.moveUp();op('z_order_up',def.id,`你上移了一层 ${def.id}`)}],['下移一层',()=>{node.moveDown();op('z_order_down',def.id,`你下移了一层 ${def.id}`)}],['水平镜像',()=>{node.scaleX(-node.scaleX());node.setAttr('flip_x',!node.getAttr('flip_x'));op('flip_x',def.id,`你水平镜像了元素 ${def.id}`)}],['垂直镜像',()=>{node.scaleY(-node.scaleY());node.setAttr('flip_y',!node.getAttr('flip_y'));op('flip_y',def.id,`你垂直镜像了元素 ${def.id}`)}],['隐藏图层',()=>{node.visible(false);op('hide',def.id,`你隐藏了元素 ${def.id}`)}],['删除图层',()=>{node.destroy();op('delete',def.id,`你删除了元素 ${def.id}`)}],['重置该元素',()=>{resetLayer(node,def);op('reset',def.id,`你重置了元素 ${def.id}`)}]];m.innerHTML=items.map((it,i)=>`<button data-i='${i}'>${it[0]}</button>`).join('');m.querySelectorAll('button').forEach(b=>b.onclick=()=>{items[Number(b.dataset.i)][1]();objectLayer.draw();m.style.display='none';renderLayerPanel();renderSelectedOps()})}
$('saveComp').onclick=async()=>{const konvaImgs=objectLayer.getChildren(node=>node.className==='Image');const layers=konvaImgs.map((n,i)=>{const m=layerNodes.find(v=>v.node===n);if(!m)return null;return {id:m.def.id,layer_url:m.def.layer_url,x:n.x(),y:n.y(),scale_x:Math.abs(n.scaleX()),scale_y:Math.abs(n.scaleY()),rotation:n.rotation(),flip_x:!!n.getAttr('flip_x'),flip_y:!!n.getAttr('flip_y'),visible:n.visible(),opacity:n.opacity(),z_index:i+1}}).filter(Boolean);const bg=S.compositionExperiment.clean_background_url||S.compositionExperiment.processed_original_url||S.compositionExperiment.background_url;const p={image_id:S.compositionExperiment.image_id,background_url:bg,layers,operations:S.compositionExperiment.operations,inpainting_used:S.compositionExperiment.inpainting_used};const b=await (await fetch(API+'/layers/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json();S.compositionExperiment.workingImageUrl=b.after_image_url;S.isSaved=true;$('analyzeComp').disabled=false;$('saveNotice').innerHTML=`已保存当前构图<br><img src='${b.after_image_url}' width='280'>`;renderSteps(5)};
$('analyzeComp').onclick=async()=>{if(!S.isSaved)return;const p={before_image_url:S.uploaded.displayUrl,after_image_url:S.compositionExperiment.workingImageUrl,layers_before:S.compositionExperiment.layers,layers_after:[],operations:S.compositionExperiment.operations,user_goal:'用于形式构成课程实验'};const b=await (await fetch(API+'/composition/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json();const md=`### summary\n${b.summary}\n### composition_change\n${b.composition_change}\n### visual_focus_analysis\n${b.visual_focus_analysis}\n### layer_order_analysis\n${b.layer_order_analysis}\n### spatial_relationship_analysis\n${b.spatial_relationship_analysis}\n### learning_explanation\n${b.learning_explanation}\n### suggestions\n${(b.suggestions||[]).map(s=>'- '+s).join('\n')}`;$('compFeedback').innerHTML=DOMPurify.sanitize(marked.parse(md));};
</script></body></html>
